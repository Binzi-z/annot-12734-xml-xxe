name: xxe-analyzer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  xxe-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Run acceptance benchmark (recall >= 85%, FPR <= 15%)
        run: |
          python tools/gen_benchmark.py
          python -m xxe_analyzer.analyze benchmark/corpus -o benchmark.sarif
          python tools/eval_benchmark.py benchmark.sarif

      - name: Full product scan (SARIF)
        run: python -m xxe_analyzer.analyze src -o xxe-results.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: xxe-results.sarif
          category: xxe-analyzer

      - name: Fail build on product findings
        run: python -m xxe_analyzer.analyze src -o /dev/null --check
